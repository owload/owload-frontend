server {
	listen 80;
	server_name _;
	root /var/www/html;

	# The built files have the hash of their content in the name: they never change, so they are kept for good. A file that is not there is a
	# 404, not the front page: the front page is not a script, and a browser that still holds an old page (which names files of an old build)
	# would show a mismatch of integrity instead of the real cause.
	location /assets/ {
	    try_files $uri =404;
	    add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Everything else (the front page, env.js, the service worker, the pictures at the root and the addresses of the app) is asked for again every
	# time, so that a new build or a new env.js is seen at once; the browser gets a 304 when nothing has changed.
	location / {
	    try_files $uri $uri/ /index.html;
	    add_header Cache-Control "no-cache";
	}
}
